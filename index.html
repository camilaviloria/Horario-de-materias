
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AulaPlan</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>AulaPlan</h1>
    <p>Organiza tu horario universitario</p>

    <h2>Materias disponibles</h2>

    <div class="materia">
        <span>Matematica</span>
        <button onclick="agregarMateria('Matematica')">Agregar</button>
    </div>

    <div class="materia">
        <span>Programacion</span>
        <button onclick="agregarMateria('Programacion')">Agregar</button>
    </div>

    <div class="materia">
        <span>Electronica</span>
        <button onclick="agregarMateria('Electronica')">Agregar</button>
    </div>

    <h2>Mis materias</h2>

    <ul id="seleccion"></ul>

    <p id="contador">Materias seleccionadas: 0</p>

    <script src="js/app.js"></script>
    <script src="js/choques.js"></script>
    <script src="js/generador.js"></script>

    <section class="panel" aria-labelledby="titulo-seleccion">
      <h2 id="titulo-seleccion" class="panel__titulo">Selección</h2>
      
      <div id="seleccion-resumen" class="seleccion-resumen"></div>
      <div id="seleccion-lista" class="seleccion-lista"></div>

      <button id="btn-generar" class="btn btn--primario" style="width: 100%; margin-bottom: 20px;">
        Generar horarios válidos
      </button>

      <h2 class="panel__titulo">Rejilla semanal</h2>
      <div id="rejilla-controles" class="controles"></div>
      <div id="rejilla" class="rejilla" role="grid" aria-label="Horario semanal"></div>
    </section>

</body>
</html>
